name: Testes do site e painel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências de envio de e-mail
        run: npm ci --ignore-scripts
      - name: Validar formulário, autenticação e painel
        run: node --test server.test.cjs accounts.test.cjs
