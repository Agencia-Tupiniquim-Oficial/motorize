name: Testes do site e painel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql-teste-descartavel-2026
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências de envio de e-mail
        run: npm ci --ignore-scripts
      - name: Validar formulário, autenticação e painel
        env:
          MYSQL_TEST_DATABASE: motorize_test_20261029
          MYSQL_TEST_PASSWORD: mysql-teste-descartavel-2026
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports[3306] }}
        run: npm test
