services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      MYSQL_HOST: ${MYSQL_HOST:-localhost}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      PUBLIC_ORIGIN: https://${DOMAIN:?Defina DOMAIN no arquivo .env}
      MOTORIZE_ADMIN_USER: ${MOTORIZE_ADMIN_USER:-admin.motorize}
      MOTORIZE_OWNER_USER: ${MOTORIZE_OWNER_USER:-Tupiniquim_Motorize}
      MOTORIZE_OWNER_EMAIL: ${MOTORIZE_OWNER_EMAIL:-ferramentas@agenciatupiniquim.com.br}
      MOTORIZE_OWNER_PASSWORD: ${MOTORIZE_OWNER_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-ferramentas@agenciatupiniquim.com.br}
    volumes:
      - motorize_data:/app/data
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  motorize_data:
  caddy_data:
  caddy_config:
